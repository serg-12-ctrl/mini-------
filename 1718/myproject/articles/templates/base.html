{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}АСУТП Портал{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    
    <link rel="stylesheet" href="{% static 'articles/css/style.css' %}" />
</head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid d-flex align-items-center position-relative" style="min-height: 80px;">
    
    <!-- 1. Логотип (слева) -->
    <div class="logo-left">
      <header style="background: #f0f0f0; padding: 5px; border-radius: 8px; display: inline-block;">
        <img src="{% static 'img/plc .png' %}" alt="Логотип" width="120">
      </header>
    </div>

    <!-- 2. Заголовок (строго по центру) -->
    <div class="position-absolute start-50 translate-middle-x">
      <a class="navbar-brand m-0" href="{% url 'index' %}" style="font-size: 1.5rem; font-weight: bold;">
        Новостной портал АСУТП
      </a>
    </div>

    <!-- 3. Меню и Кнопки (справа) -->
    <div class="ms-auto d-flex align-items-center">
      <div class="navbar-nav flex-row gap-3 me-3">
        <a class="nav-link" href="{% url 'forum_rules' %}">📜 Правила</a>
        <a class="nav-link" href="{% url 'faq' %}">❓ FAQ</a>
      </div>
      
      <div class="navbar-nav">
        {% if user.is_authenticated %}
          <span class="navbar-text me-3 d-none d-md-inline">Привет, {{ user.username }}!</span>
          <a class="nav-link me-3" href="{% url 'saved_articles' %}">
    <span class="star-icon">⭐</span> Избранное
</a>
          <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm">Выход</button>
          </form>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}">Войти</a>
        {% endif %}
      </div>
    </div>

  </div>
</nav>


    <div class="container mt-4">{% block content %} {% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
