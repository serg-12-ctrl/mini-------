{% extends 'base.html' %}

{% block title %}Часто задаваемые вопросы (FAQ){% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Часто задаваемые вопросы</h2>
    
    <div class="list-group">
        {% for item in questions %}
            <!-- Ссылка ведет на страницу конкретного вопроса, передавая его id (item.pk) -->
            <a href="{% url 'faq_detail' item.pk %}" class="list-group-item list-group-item-action font-weight-bold py-3">
                {{ item.question }} &rarr;
            </a>
        {% empty %}
            <div class="alert alert-info">Раздел FAQ пуст.</div>
        {% endfor %}
    </div>
    
    <a href="{% url 'index' %}" class="btn btn-secondary mt-4">Назад на главную</a>
</div>
{% endblock %}
